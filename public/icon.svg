<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- White Card Squircle Background with subtle border -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" />

  <!-- Connecting Lines & Arrows -->
  <!-- Top Arrow: Green -> Blue -->
  <line x1="44" y1="32" x2="56" y2="32" stroke="#1E293B" stroke-width="2.8" stroke-linecap="round" />
  <polygon points="55,28 61,32 55,36" fill="#1E293B" />

  <!-- Left Arrow: Green -> Red -->
  <line x1="32" y1="44" x2="32" y2="56" stroke="#1E293B" stroke-width="2.8" stroke-linecap="round" />
  <polygon points="28,55 32,61 36,55" fill="#1E293B" />

  <!-- Right Arrow: Blue -> Yellow -->
  <line x1="68" y1="44" x2="68" y2="56" stroke="#1E293B" stroke-width="2.8" stroke-linecap="round" />
  <polygon points="64,55 68,61 72,55" fill="#1E293B" />

  <!-- 1. Top-Left: Green Circle -->
  <circle cx="32" cy="32" r="12" fill="#22C55E" stroke="#1E293B" stroke-width="2.5" />

  <!-- 2. Top-Right: Blue Diamond -->
  <rect x="59" y="23" width="18" height="18" rx="3.5" transform="rotate(45 68 32)" fill="#3B82F6" stroke="#1E293B" stroke-width="2.5" />

  <!-- 3. Bottom-Left: Red Rounded Square -->
  <rect x="21" y="57" width="22" height="22" rx="5.5" fill="#EF4444" stroke="#1E293B" stroke-width="2.5" />

  <!-- 4. Bottom-Right: Yellow Circle -->
  <circle cx="68" cy="68" r="12" fill="#F59E0B" stroke="#1E293B" stroke-width="2.5" />
</svg>
